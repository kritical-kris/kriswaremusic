<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Blox Bros. — Music</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="smash-header">
        <div class="header-left">
            <span class="brand-badge red">BLOX</span>
            <a href="https://kriswarelabs.github.io/krisware.github.io/" class="home-btn" style="text-decoration: none; color: #ccc;">🏠 Home</a>
        </div>
        <div class="header-center">
            <h1>SUPER BLOX BROS. <span class="header-sub">MUSIC</span></h1>
        </div>
        <div class="header-right">
            <span class="brand-badge red">SWITCH</span>
        </div>
    </header>

    <main class="content-wrapper">

        <section class="hero-banner">
            <div class="hero-content">
                <span class="hero-subtitle">Main Theme</span>
                <h2 id="hero-title" class="hero-title">Spawnlight</h2>
                
                <div class="hero-buttons">
                    <button class="hero-btn">Original Version <span class="play-icn">▶</span></button>
                    <button class="hero-btn">Remix Ver. <span class="play-icn">▶</span></button>
                </div>
            </div>
            <div class="hero-footer-btn">
                E3 Ver. <span class="pause-icn">❚❚</span>
            </div>
        </section>

        <section class="sound-list" id="track-list">
            <!-- Dynamic track items loaded by JS -->
        </section>

    </main>

    <!-- Slide-out Navigation Drawer -->
    <div id="sidebar-overlay" class="sidebar-overlay"></div>
    <aside id="side-drawer" class="side-drawer">
        <div class="drawer-header">
            <h3>NAVIGATE</h3>
            <button id="close-drawer-btn" class="close-btn">&times;</button>
        </div>
        <ul class="drawer-links">
            <li><a href="https://kriswarelabs.github.io/krisware.github.io/">Krisware Portal</a></li>
            <li><a href="https://roblox.com" target="_blank" rel="noopener">Official Roblox Group</a></li>
            <li><a href="#hero-title">Main Theme</a></li>
            <li><a href="#track-list">Tracklist</a></li>
            <li><a href="https://github.com/kritical-kris/kriswaremusic" target="_blank" rel="noopener">GitHub Repository</a></li>
        </ul>
    </aside>

    <!-- Floating UI Controls -->
    <div class="floating-side-bar">
        <button id="play-all-btn" class="vertical-tab">
            Play All <span class="dot"></span>
        </button>
        <button id="open-menu-btn" class="menu-circle-btn">
            <div class="menu-lines"><span></span><span></span><span></span></div>
            <span>MENU</span>
        </button>
    </div>

    <audio id="audio-player"></audio>

    <script src="script.js"></script>
</body>
</html>
