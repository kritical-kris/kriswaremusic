<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Blox Bros. — Music</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Global Header Top Bar -->
    <header class="smash-header">
        <div class="header-left">
            <span class="brand-badge red">BLOX</span>
            <span class="home-btn">🏠 Home</span>
        </div>
        <div class="header-center">
            <h1>SUPER BLOX BROS. <span class="header-sub">MUSIC</span></h1>
        </div>
        <div class="header-right">
            <span class="brand-badge red">SWITCH</span>
        </div>
    </header>

    <main class="content-wrapper">

        <!-- Featured Track Banner -->
        <section class="hero-banner">
            <div class="hero-content">
                <span class="hero-subtitle">Main Theme</span>
                <h2 id="hero-title" class="hero-title">Super Blox Bros - Menu</h2>
                
                <div class="hero-buttons">
                    <button class="hero-btn active" id="hero-play-1">Original Version <span class="play-icn">▶</span></button>
                    <button class="hero-btn" id="hero-play-2">Remix Ver. <span class="play-icn">▶</span></button>
                </div>
            </div>
            <div class="hero-footer-btn" id="hero-play-3">
                E3 2026 Ver. <span class="pause-icn">❚❚</span>
            </div>
        </section>

        <!-- Track List Section -->
        <section class="sound-list" id="track-list">
            <!-- Tracks dynamically rendered here -->
        </section>

    </main>

    <!-- Side Menu / Floating Controls -->
    <div class="floating-side-bar">
        <div class="vertical-tab">Play All <span class="dot"></span></div>
        <button class="menu-circle-btn">
            <div class="menu-lines"><span></span><span></span><span></span></div>
            <span>MENU</span>
        </button>
    </div>

    <!-- Hidden Audio Player -->
    <audio id="audio-player"></audio>

    <script src="dist/main.js"></script>
</body>
</html>
